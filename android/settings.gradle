pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def file = new File(rootProject.projectDir, "local.properties")
        if (file.exists()) {
            file.withReader("UTF-8") { reader -> properties.load(reader) }
        }
        def sdkPath = properties.getProperty("flutter.sdk")
        if (sdkPath == null || !new File(sdkPath, "packages/flutter_tools/gradle").exists()) {
            def envSdk = System.getenv("FLUTTER_ROOT") ?: System.getenv("FLUTTER_HOME")
            if (envSdk != null && new File(envSdk, "packages/flutter_tools/gradle").exists()) {
                sdkPath = envSdk
            }
        }
        return sdkPath
    }()

    if (flutterSdkPath != null && new File(flutterSdkPath, "packages/flutter_tools/gradle").exists()) {
        includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    } else {
        def msg = "Flutter SDK build tools not found at '${flutterSdkPath}/packages/flutter_tools/gradle'.\n" +
            "Please update 'flutter.sdk' in local.properties to point to your installed Flutter SDK directory."
        throw new GradleException(msg)
    }

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.2.2" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

include ":app"
