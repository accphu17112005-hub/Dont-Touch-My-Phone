name: dont_touch_my_phone
description: A production-quality mobile security alarm application that protects your phone from unauthorized access.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.2.0

  # Local storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Secure storage for PIN
  flutter_secure_storage: ^9.0.0

  # Sensors
  sensors_plus: ^4.0.2

  # Permissions
  permission_handler: ^11.3.0

  # Audio
  audioplayers: ^6.0.0

  # Vibration
  vibration: ^3.2.1

  # Shared preferences (for simple settings)
  shared_preferences: ^2.2.2

  # UI / Icons
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0

  # Animations
  lottie: ^3.0.0
  animate_do: ^3.3.4

  # Connectivity (Airplane mode detection)
  connectivity_plus: ^5.0.2

  # Battery
  battery_plus: ^4.0.1

  # Local notifications
  flutter_local_notifications: ^17.0.0

  # App lifecycle
  flutter_foreground_task: ^8.0.2

  # Intl for date formatting
  intl: ^0.19.0

  # Path provider
  path_provider: ^2.1.2

  # Crypto for PIN hashing
  crypto: ^3.0.3

  # UUID for event IDs
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
